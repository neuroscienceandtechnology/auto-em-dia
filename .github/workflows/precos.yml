name: Preços de combustível (ANP)

# Lê o levantamento semanal da ANP e publica precos-combustiveis.json (média por estado) no GitHub Pages.
on:
  schedule:
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/anp_precos.py, .github/workflows/precos.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/anp_precos.py precos-combustiveis.json
      - name: Commit se os preços mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precos-combustiveis.json
          # Ignora só o horário de geração ao decidir se houve mudança.
          if git diff --cached -I geradoEm --quiet; then echo "Sem mudança"; exit 0; fi
          git commit -m "Preços ANP $(date -u +%F)"
          git push
